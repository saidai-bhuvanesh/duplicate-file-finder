[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterpriseit-rag"
version = "1.0.0"
description = "Adaptive Multi-Agent Enterprise Knowledge Assistant for IT Teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EnterpriseIT-RAG Team" }]

dependencies = [
    # ── Web Framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",

    # ── Database ──────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Cache / Queue ─────────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.4",
    "celery[redis]>=5.4.0",
    "kombu>=5.3.4",

    # ── LLM / Agent Orchestration ─────────────────────────────────────────────
    "langchain>=0.2.6",
    "langchain-core>=0.2.10",
    "langchain-community>=0.2.6",
    "langchain-openai>=0.1.14",
    "langchain-groq>=0.1.6",
    "langgraph>=0.1.14",
    "openai>=1.35.0",
    "groq>=0.9.0",
    "tiktoken>=0.7.0",

    # ── Embeddings / Vector Retrieval ─────────────────────────────────────────
    "sentence-transformers>=3.0.1",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",

    # ── Document Processing ───────────────────────────────────────────────────
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "python-magic>=0.4.27",
    "chardet>=5.2.0",

    # ── NLP ───────────────────────────────────────────────────────────────────
    "spacy>=3.7.5",
    "transformers>=4.41.2",
    "torch>=2.3.0",
    "accelerate>=0.31.0",

    # ── Graph Database ─────────────────────────────────────────────────────────
    "neo4j>=5.21.0",

    # ── HTTP Client ──────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",

    # ── Serialization / Utilities ─────────────────────────────────────────────
    "orjson>=3.10.3",
    "python-slugify>=8.0.4",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",

    # ── Logging ───────────────────────────────────────────────────────────────
    "structlog>=24.2.0",
    "rich>=13.7.1",

    # ── Observability ────────────────────────────────────────────────────────
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "prometheus-client>=0.20.0",

    # ── Security ─────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.8",

    # ── Evaluation ───────────────────────────────────────────────────────────
    "ragas>=0.1.10",
    "datasets>=2.20.0",
    "evaluate>=0.4.2",

    # ── Data / Encoding ───────────────────────────────────────────────────────
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "xxhash>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",        # For TestClient
    "factory-boy>=3.3.0",
    "Faker>=25.8.0",
    "anyio>=4.4.0",
    "mypy>=1.10.0",
    "ruff>=0.4.9",
    "black>=24.4.2",
    "pre-commit>=3.7.1",
    "ipykernel>=6.29.4",
]

[project.scripts]
enterpriseit-rag = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]
markers = [
    "unit: Unit tests (fast, no IO)",
    "integration: Integration tests (require running services)",
    "slow: Slow tests (LLM calls, large models)",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
